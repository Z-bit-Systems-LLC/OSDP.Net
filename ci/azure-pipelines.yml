trigger:
  branches:
    include:
    - main
  tags:
    include:
    - v*

# Self-hosted agents; the SDK, NuGet and ReSharper caches persist between runs
pool:
  name: Default
  demands:
  - Agent.OS -equals Linux

variables:
  buildConfiguration: 'Release'

jobs:
  - job: build
    steps:
      - checkout: self
      - template: build.yml

  - job: inspect
    steps:
      - checkout: self
      - template: inspect.yml

  - job: package
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    dependsOn:
      - build
      - inspect
    steps:
      - checkout: self
        persistCredentials: true
        clean: true
      - template: package.yml

  - job: docs
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    dependsOn:
      - build
      - inspect
    variables:
      doxygenVersion: '1.15.0'
      doxygenUrl: 'https://github.com/doxygen/doxygen/releases/download/Release_1_15_0/doxygen-1.15.0.linux.bin.tar.gz'
      doxygenSha256: '0ec2e5b2c3cd82b7106d19cb42d8466450730b8cb7a9e85af712be38bf4523a1'
    steps:
      - checkout: self
        clean: true
      - template: docs.yml
